name: Caption Health
description: >-
  Caption Health was an artificial-intelligence medical-imaging company founded in 2013 and
  headquartered in San Mateo, California, that built FDA-cleared AI software to guide clinicians
  through cardiac ultrasound scans in real time. Its flagship products, Caption Guidance and
  Caption AI, provided real-time image-acquisition guidance, automated image-quality assessment,
  and automatic ejection-fraction calculation, enabling non-specialist healthcare professionals to
  capture diagnostic-quality echocardiograms. Backed by DCVC and others (it raised a $53M Series B
  in 2020), Caption Health was acquired by GE HealthCare in February 2023 for roughly $150M and its
  technology was absorbed into GE HealthCare's ultrasound portfolio, shipping as Caption AI on the
  Vscan Air handheld system and within the Verisound AI digital-solutions line. The company no
  longer operates as an independent entity and publishes no public developer API; this profile is
  retained as a network record of an acquired provider.
